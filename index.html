<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1743d4">
  <title>The Creative Maestro</title>
  <style>
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 30% 15%, #2857ed, #1638b8 70%);
      color: white;
      font-family: system-ui, sans-serif;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 7rem);
      font-weight: 900;
      letter-spacing: -0.06em;
      line-height: 1.05;
      text-wrap: balance;
    }

    .sparkle {
      display: block;
      margin-bottom: 1rem;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
    }
  </style>
</head>
<body>
  <main>
    <span class="sparkle" aria-hidden="true">✦</span>
    <h1>Hi I'm Jack, The Creative Maestro!</h1>
  </main>
</body>
</html>
